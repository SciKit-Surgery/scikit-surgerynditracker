on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-ver: ['3.10', 3.11, 3.12, 3.13, 3.14]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: ${{ matrix.python-ver }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          coverage erase
          coverage run -a --source ./sksurgerynditracker -m pytest -s -v
          coverage report -m

      - name: Linting
        run: |
          pylint --rcfile=tests/pylintrc --ignore _version.py sksurgerynditracker tests

      - name: Run coveralls
        run: |
          pip install coveralls pyyaml
          coveralls

  deploy:
    runs-on: ubuntu-22.04
    needs: test
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v2
      - uses: actions/checkout@master
      - name: Set up Python
        uses: actions/setup-python@v1
        with:
          python-version: 3.12

      - name: Install dependencies
        run: python -m pip install wheel twine setuptools

      - name: Build wheel
        run: |
          python setup.py sdist

      - name: Publish package if tagged release
        if: startsWith(github.event.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
